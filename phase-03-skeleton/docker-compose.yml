services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: warehouse
      MYSQL_USER: warehouse_user
      MYSQL_PASSWORD: warehouse_pass
    ports:
      - "3306:3306"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "mysql -h localhost -u$$MYSQL_USER -p$$MYSQL_PASSWORD -e 'SELECT 1' || exit 1"]
      timeout: 20s
      retries: 10

  app:
    build: .
    ports:
      - "8081:8081"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: warehouse_user
      DB_PASSWORD: warehouse_pass
      DB_NAME: warehouse
    depends_on:
      mysql:
        condition: service_healthy

  test:
    profiles: ["test"]
    build:
      context: .
      target: builder
    command: go test ./... -v
