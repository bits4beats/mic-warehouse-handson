openapi: 3.1.0
info:
  title: MIC Monolith - Warehouse-relevant Legacy API
  version: 1.0.0
  description: |
    Baseline legacy API contract for the MIC PHP monolith routes that are
    candidates for Strangler Fig migration.

    This is intentionally not the final platform-compliant Business Capability
    contract. It documents the Phase 01 runtime shape: unversioned `/api/*`
    paths, legacy `{ "error": "..." }` errors, and response envelopes such as
    `{ "data": [...] , "meta": {...} }`.
servers:
  - url: http://localhost:8088
    description: Local Docker Compose, monolith direct

paths:
  /api/articles:
    get:
      summary: List articles
      operationId: listArticles
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Status'
      responses:
        '200':
          description: Paginated article list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleListEnvelope'
    post:
      summary: Create article
      operationId: createArticle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleInput'
      responses:
        '201':
          description: Article created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/articles/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      summary: Get article by internal numeric id
      operationId: getArticle
      responses:
        '200':
          description: Article detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Update article
      operationId: updateArticle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleInput'
      responses:
        '200':
          description: Article updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Delete article
      operationId: deleteArticle
      responses:
        '200':
          description: Article deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/magazzini:
    get:
      summary: List warehouses
      operationId: listWarehouses
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Status'
      responses:
        '200':
          description: Paginated warehouse list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WarehouseListEnvelope'
    post:
      summary: Create warehouse
      operationId: createWarehouse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WarehouseInput'
      responses:
        '201':
          description: Warehouse created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WarehouseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/magazzini/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      summary: Get warehouse by internal numeric id
      operationId: getWarehouse
      responses:
        '200':
          description: Warehouse detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WarehouseEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Update warehouse
      operationId: updateWarehouse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WarehouseInput'
      responses:
        '200':
          description: Warehouse updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WarehouseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Delete warehouse
      operationId: deleteWarehouse
      responses:
        '200':
          description: Warehouse deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/magazzini/{id}/giacenze:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      summary: List stock levels for a warehouse
      operationId: listInventoryForWarehouse
      responses:
        '200':
          description: Stock levels for the selected warehouse
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryLevelListEnvelope'

components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
      description: Internal numeric `business_data.id`, not SKU or business code.
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 50
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    Search:
      name: q
      in: query
      required: false
      schema:
        type: string
      description: Searches code, name, description, and text_1.
    Status:
      name: status
      in: query
      required: false
      schema:
        type: string

  responses:
    BadRequest:
      description: Invalid request body or missing required legacy field
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  schemas:
    Meta:
      type: object
      required: [total, limit, offset]
      properties:
        total:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
        offset:
          type: integer
          minimum: 0

    ArticleListEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Article'
        meta:
          $ref: '#/components/schemas/Meta'

    ArticleEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Article'

    Article:
      type: object
      required:
        - id
        - sku
        - nome
        - descrizione
        - prezzo_listino
        - qta_minima
        - categoria
        - iva_default
        - unita
        - peso_kg
        - status
        - created_at
        - updated_at
      properties:
        id:
          type: integer
        sku:
          type: [string, 'null']
          description: "`business_data.code` for `record_type = articolo`."
        nome:
          type: [string, 'null']
          description: "`business_data.name`."
        descrizione:
          type: [string, 'null']
          description: "`business_data.description`."
        prezzo_listino:
          type: [number, 'null']
          description: "`business_data.amount_1`."
        qta_minima:
          type: [number, 'null']
          description: "`business_data.amount_2`."
        categoria:
          type: [string, 'null']
          description: "`business_data.text_1`."
        iva_default:
          type: [string, 'null']
          description: "`business_data.text_2`."
        unita:
          type: string
          default: pz
        peso_kg:
          type: [number, 'null']
        status:
          type: [string, 'null']
        created_at:
          type: [string, 'null']
          format: date-time
        updated_at:
          type: [string, 'null']
          format: date-time

    ArticleInput:
      type: object
      properties:
        sku:
          type: string
          description: Preferred legacy API field; mapped to `business_data.code`.
        code:
          type: string
          description: Alias accepted by the PHP controller.
        nome:
          type: string
          description: Preferred legacy API field; mapped to `business_data.name`.
        name:
          type: string
          description: Alias accepted by the PHP controller.
        descrizione:
          type: string
        description:
          type: string
        prezzo_listino:
          type: number
          minimum: 0
        qta_minima:
          type: number
          minimum: 0
          default: 1
        categoria:
          type: string
        iva_default:
          type: string
          default: IVA22
        unita:
          type: string
          default: pz
        peso_kg:
          type: number
        status:
          type: string
          default: attivo
      description: |
        The Phase 01 controller performs minimal validation. In practice,
        callers should provide at least `sku`, `nome`, and `prezzo_listino`.

    WarehouseListEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Warehouse'
        meta:
          $ref: '#/components/schemas/Meta'

    WarehouseEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Warehouse'

    Warehouse:
      type: object
      required: [id, codice, nome, descrizione, citta, cap, status]
      properties:
        id:
          type: integer
        codice:
          type: [string, 'null']
          description: "`business_data.code`."
        nome:
          type: [string, 'null']
          description: "`business_data.name`."
        descrizione:
          type: [string, 'null']
          description: "`business_data.description`."
        citta:
          type: [string, 'null']
          description: "`business_data.text_1`."
        cap:
          type: [string, 'null']
          description: "`business_data.text_2`."
        status:
          type: [string, 'null']

    WarehouseInput:
      type: object
      properties:
        codice:
          type: string
          description: Preferred legacy API field; mapped to `business_data.code`.
        code:
          type: string
          description: Alias accepted by the PHP controller.
        nome:
          type: string
          description: Preferred legacy API field; mapped to `business_data.name`.
        name:
          type: string
          description: Alias accepted by the PHP controller.
        descrizione:
          type: string
        citta:
          type: string
        cap:
          type: string
        status:
          type: string
          default: attivo
      description: |
        The Phase 01 controller performs minimal validation. In practice,
        callers should provide at least `codice` and `nome`.

    InventoryLevelListEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/InventoryLevel'

    InventoryLevel:
      type: object
      required: [articolo_id, sku, articolo_nome, giacenza]
      properties:
        articolo_id:
          type: integer
        sku:
          type: [string, 'null']
        articolo_nome:
          type: [string, 'null']
        giacenza:
          type: number
          description: Sum of stock movement quantities for the article in the selected warehouse.

    DeleteEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [id, deleted]
          properties:
            id:
              type: integer
            deleted:
              type: boolean
              const: true

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
          examples: [not_found, invalid_body, route_not_found, server_error]
        message:
          type: string
        path:
          type: string
        details:
          type: object
          additionalProperties: true
